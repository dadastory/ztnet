services:
  postgres:
    image: ${POSTGRES_IMAGE-postgres:15.2-alpine}
    container_name: ztnet-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ztnet
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    networks:
      - ztnet-local

